<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | BYEIT</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <a href="index.html" class="auth-logo">
                BYEIT
            </a>

            <h1>Welcome back</h1>

            <p class="auth-subtitle">
                Sign in to continue shopping with BYEIT.
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Sign In
                </button>

                <p id="loginMessage" class="auth-message"></p>

            </form>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
