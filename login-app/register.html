<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | BYEIT</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <a href="index.html" class="auth-logo">
                BYEIT
            </a>

            <h1>Create account</h1>

            <p class="auth-subtitle">
                Join BYEIT and start shopping your way.
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

                <p id="registerMessage" class="auth-message"></p>

            </form>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </p>

        </div>

    </div>

    <script src="register.js"></script>

</body>

</html>
